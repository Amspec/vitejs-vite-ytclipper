<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>loop · YouTube snippet</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="card">
      <h1>
        ⏱️ YT looper
        <span>no API key</span>
      </h1>

      <!-- input area -->
      <div class="input-grid">
        <div class="url-row">
          <div class="url-icon">🔗</div>
          <input
            type="text"
            id="youtubeUrl"
            placeholder="Paste YouTube link (youtu.be/… or youtube.com/watch?v=…)"
            value="https://www.youtube.com/watch?v=dQw4w9WgXcQ"
          />
        </div>

        <div class="time-row">
          <div class="time-group">
            <span class="time-label">start</span>
            <div class="time-input-wrap">
              <input
                type="text"
                id="startTime"
                value="0:10"
                placeholder="0:00"
                inputmode="numeric"
                autocomplete="off"
                spellcheck="false"
              />
              <span class="time-unit">mm:ss</span>
            </div>
          </div>

          <div class="time-group">
            <span class="time-label">end</span>
            <div class="time-input-wrap">
              <input
                type="text"
                id="endTime"
                value="0:25"
                placeholder="0:30"
                inputmode="numeric"
                autocomplete="off"
                spellcheck="false"
              />
              <span class="time-unit">mm:ss</span>
            </div>
          </div>

          <div class="actions">
            <button class="btn btn-primary" id="loopBtn">
              ⟳ loop &amp; save
            </button>
            <button class="btn btn-ghost" id="resetBtn">reset</button>
          </div>
        </div>
      </div>

      <!-- video embed -->
      <div class="video-container">
        <div id="ytPlayer"></div>
      </div>

      <!-- status -->
      <div class="status-bar">
        <div class="status-message">
          <span class="dot" id="statusDot"></span>
          <span id="statusText">ready · paste URL and set times</span>
        </div>
        <div class="badge" id="timeBadge">loop: 0:10 – 0:25</div>
      </div>

      <!-- saved clips panel -->
      <div class="saved-panel">
        <div class="saved-header" id="savedHeader">
          <div class="saved-title">
            💾 saved clips
            <span class="saved-count" id="savedCount">0</span>
          </div>
          <button
            class="saved-toggle"
            id="savedToggle"
            aria-label="toggle saved clips"
          >
            ▼
          </button>
        </div>
        <div class="saved-list" id="savedList">
          <!-- clip items injected by JS -->
        </div>
      </div>
    </div>

    <!-- YouTube IFrame Player API (no key required) -->
    <script>
      var tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      var firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    </script>

    <script src="script.js"></script>
  </body>
</html>
